<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Enroll in Course</title>
</head>
<body>
    <h1>Enroll User in Course</h1>

        <input type="text" id="user_id" name="user_id" maxlength="10" required><br><br>

    </form>

    <p>This form corresponds to inserting into Enrolled_Courses.</p>
</body>
</html>
